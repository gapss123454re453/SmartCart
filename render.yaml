services:
  - type: web
    name: smartcart-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && npm run prisma:seed && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartcart-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WEIGHT_TOLERANCE_PERCENTAGE
        value: "0.5"
      - key: EXIT_TOKEN_TTL_MINUTES
        value: "15"
      - key: NODE_VERSION
        value: "22"

databases:
  - name: smartcart-postgres
    plan: free
