services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartcart
    ports:
      - "5432:5432"
    volumes:
      - smartcart-postgres-data:/var/lib/postgresql/data

volumes:
  smartcart-postgres-data:
